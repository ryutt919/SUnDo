name: iOS 시뮬레이터 통합 테스트 (수동 실행)

# SUnDo-ios를 macOS 러너의 iOS 시뮬레이터에 실제로 띄워 통합 테스트를 돌리고,
# 위젯 확장(RoutiningWidget.appex)이 앱에 포함되는지 확인한다. Actions 탭에서 직접 실행할 때만 돈다.
on:
  workflow_dispatch:

jobs:
  simulator:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: SUnDo-ios
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 시뮬레이터 켜기
        run: |
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          echo "시뮬레이터: $UDID"
          xcrun simctl boot "$UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
      - name: 위젯 Swift 로직 실행 확인(JSON 해석, 쪽 보정, 쪽 넘김 버튼)
        run: |
          mkdir -p /tmp/widget_test
          sed 's/^@main$//' ios/RoutiningWidget/RoutiningWidget.swift > /tmp/widget_test/widget_nomain.swift
          swiftc -target arm64-apple-macos14.0 -o /tmp/widget_test/logic_test /tmp/widget_test/widget_nomain.swift ios/RoutiningWidgetTests/main.swift
          /tmp/widget_test/logic_test ios/RoutiningWidgetTests/snapshot_fixture.json
      - name: 통합 테스트(앱 실행)
        run: flutter test integration_test -d "$UDID"
      - name: 위젯 확장이 앱에 포함되는지 확인
        run: |
          flutter build ios --simulator --debug --no-codesign
          ls -la build/ios/iphonesimulator/Runner.app/PlugIns
          test -d build/ios/iphonesimulator/Runner.app/PlugIns/RoutiningWidget.appex
